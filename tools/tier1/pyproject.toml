[project]
name = "tier1"
version = "0.1.0"
description = "Experiments that need a debug build, run in one, and recorded so a reader does not need one"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["cpybuild"]

[project.scripts]
tier1 = "tier1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tier1"]

[tool.uv.sources]
cpybuild = { workspace = true }
