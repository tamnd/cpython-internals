<svg xmlns="http://www.w3.org/2000/svg" width="908" height="536" viewBox="-24.0 -24.0 908.0 536.0" role="img" aria-label="the-loop"><rect x="-24.0" y="-24.0" width="908.0" height="536.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="320.0" height="100.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="540.0" y="50.0" width="320.0" height="100.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="540.0" y="280.0" width="320.0" height="100.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="280.0" width="320.0" height="100.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="320.0,100.0 540.0,100.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="540.0" y1="100.0" x2="527.4" y2="93.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="540.0" y1="100.0" x2="527.4" y2="106.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="700.0,150.0 700.0,280.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="700.0" y1="280.0" x2="706.1" y2="267.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="700.0" y1="280.0" x2="693.9" y2="267.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="540.0,330.0 320.0,330.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="320.0" y1="330.0" x2="332.6" y2="336.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="320.0" y1="330.0" x2="332.6" y2="323.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="160.0,280.0 160.0,150.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="160.0" y1="150.0" x2="153.9" y2="162.6" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="160.0" y1="150.0" x2="166.1" y2="162.6" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The whole interpreter</text><text x="160.0" y="104.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">read two bytes</text><text x="0.0" y="171.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">opcode and argument</text><text x="700.0" y="104.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">look up the handler</text><text x="540.0" y="171.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one entry per opcode</text><text x="700.0" y="334.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">run it</text><text x="540.0" y="401.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">push, pop, compare, call</text><text x="160.0" y="334.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">move the pointer on</text><text x="0.0" y="401.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">past the inline caches</text><text x="170.0" y="218.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">and again</text><text x="0.0" y="441.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">That is it. There is no scheduler, no plan and no lookahead. The interpreter reads one</text><text x="0.0" y="461.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">instruction, does what it says, and reads the next one. Everything Python can do is one</text><text x="0.0" y="481.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">of the handlers in the top right box, and there are about two hundred of them.</text></svg>
