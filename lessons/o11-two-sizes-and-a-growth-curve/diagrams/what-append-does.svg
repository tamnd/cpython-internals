<svg xmlns="http://www.w3.org/2000/svg" width="681" height="558" viewBox="-24.0 -24.0 681.3 558.0" role="img" aria-label="what-append-does"><rect x="-24.0" y="-24.0" width="681.3" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="404.0" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="404.0" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="310.0" width="404.0" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="404.0" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="202.0,120.0 202.0,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="202.0" y1="180.0" x2="208.1" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="202.0" y1="180.0" x2="195.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="202.0,250.0 202.0,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="202.0" y1="310.0" x2="208.1" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="202.0" y1="310.0" x2="195.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="202.0,380.0 202.0,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="202.0" y1="440.0" x2="208.1" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="202.0" y1="440.0" x2="195.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">One append, start to finish</text><text x="202.0" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">is there a spare slot already</text><text x="202.0" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">if yes, write it and bump ob_size</text><text x="202.0" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">if no, work out a bigger size</text><text x="202.0" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">realloc the array and copy nothing</text><text x="214.0" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">allocated &gt; ob_size</text><text x="214.0" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no allocation at all, which is the common case</text><text x="214.0" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">about 12 percent more, plus six</text></svg>
