<svg xmlns="http://www.w3.org/2000/svg" width="868" height="452" viewBox="-24.0 -24.0 868.0 452.0" role="img" aria-label="a-callback-that-stays-or-goes"><rect x="-24.0" y="-24.0" width="868.0" height="452.0" fill="#ffffff"/><rect x="0.0" y="87.0" width="380.0" height="57.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="147.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="207.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="267.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="440.0" y="87.0" width="380.0" height="57.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="440.0" y="147.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="440.0" y="207.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="440.0" y="267.0" width="380.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="344.0" width="820.0" height="60.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The same callback, one line different</text><text x="124.8" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">returns None</text><text x="16.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">called on every execution</text><text x="16.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">2003 calls for a loop of 1000</text><text x="16.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the loop stays instrumented</text><text x="16.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">what a debugger wants</text><text x="549.0" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">returns DISABLE</text><text x="456.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">called once per location</text><text x="456.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">5 calls for the same loop</text><text x="456.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">that instruction is put back</text><text x="456.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">what a coverage tool wants</text><text x="410.0" y="378.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Coverage is cheap because it only needs to be told once.</text></svg>
