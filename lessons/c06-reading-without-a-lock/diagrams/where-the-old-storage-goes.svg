<svg xmlns="http://www.w3.org/2000/svg" width="867" height="558" viewBox="-24.0 -24.0 867.4 558.0" role="img" aria-label="where-the-old-storage-goes"><rect x="-24.0" y="-24.0" width="867.4" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="350.0" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="350.0" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="310.0" width="350.0" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="350.0" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="175.0,120.0 175.0,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="175.0" y1="180.0" x2="181.1" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="175.0" y1="180.0" x2="168.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="175.0,250.0 175.0,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="175.0" y1="310.0" x2="181.1" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="175.0" y1="310.0" x2="168.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="175.0,380.0 175.0,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="175.0" y1="440.0" x2="181.1" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="175.0" y1="440.0" x2="168.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Why a reader never sees memory that was freed underneath it</text><text x="175.0" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a writer replaces the storage</text><text x="175.0" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the old block joins a queue</text><text x="175.0" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">every thread reaches a check</text><text x="175.0" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the block is handed back</text><text x="187.0" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">not freed yet</text><text x="187.0" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">with a sequence number</text><text x="187.0" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so nobody is looking</text></svg>
