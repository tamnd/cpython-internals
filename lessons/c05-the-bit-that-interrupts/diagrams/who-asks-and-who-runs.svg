<svg xmlns="http://www.w3.org/2000/svg" width="881" height="364" viewBox="-24.0 -24.0 880.8 364.0" role="img" aria-label="who-asks-and-who-runs"><rect x="-24.0" y="-24.0" width="880.8" height="364.0" fill="#ffffff"/><polyline points="0.0,76.0 832.8,76.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,76.0 832.8,76.0 832.8,116.0 0.0,116.0 0.0,76.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 832.8,116.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 832.8,116.0 832.8,156.0 0.0,156.0 0.0,116.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 832.8,156.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 832.8,156.0 832.8,196.0 0.0,196.0 0.0,156.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 832.8,196.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 832.8,196.0 832.8,236.0 0.0,236.0 0.0,196.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 832.8,236.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 832.8,236.0 832.8,276.0 0.0,276.0 0.0,236.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 832.8,276.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Five ways to set a bit, and where the work lands</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what you call</text><text x="282.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">whose bit it sets</text><text x="569.2" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which thread does the work</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">signal.raise_signal</text><text x="282.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the main thread</text><text x="569.2" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the main thread, always</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Py_AddPendingCall</text><text x="282.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the main thread</text><text x="569.2" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the main thread, always</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">PyThreadState_SetAsyncExc</text><text x="282.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the thread you named</text><text x="569.2" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">that thread</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">_Py_ScheduleGC</text><text x="282.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the thread allocating</text><text x="569.2" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">that thread</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">sys.remote_exec</text><text x="282.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a thread in another process</text><text x="569.2" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the main thread over there</text><text x="0.0" y="309.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Asking is cheap and never blocks. Whoever owns the bit does the work later.</text></svg>
