[project]
name = "boss"
version = "0.1.0"
description = "The end of part boss fights, and the harness that keeps their graders honest"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
boss = "boss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss"]
