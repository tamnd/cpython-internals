<svg xmlns="http://www.w3.org/2000/svg" width="964" height="452" viewBox="-24.0 -24.0 964.0 452.0" role="img" aria-label="what-limited-costs"><rect x="-24.0" y="-24.0" width="964.0" height="452.0" fill="#ffffff"/><rect x="0.0" y="87.0" width="428.0" height="57.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="147.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="207.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="267.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="488.0" y="87.0" width="428.0" height="57.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="488.0" y="147.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="488.0" y="207.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="488.0" y="267.0" width="428.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="344.0" width="916.0" height="60.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What defining Py_LIMITED_API actually changes</text><text x="123.2" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">an ordinary build</text><text x="16.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">PyObject has fields</text><text x="16.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Py_DECREF is a decrement</text><text x="16.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Py_TYPE reads ob_type</text><text x="16.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">recompile for every minor release</text><text x="621.9" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a limited build</text><text x="504.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">PyObject is an opaque type</text><text x="504.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Py_DECREF calls _Py_DecRef</text><text x="504.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Py_TYPE calls Py_TYPE</text><text x="504.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">one build runs on many releases</text><text x="458.0" y="378.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">It takes away the layout, not the functions. Every field read becomes a call.</text></svg>
