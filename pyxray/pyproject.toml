[project]
name = "pyxray"
version = "0.1.0"
description = "Instrumentation for looking inside a running CPython, from a notebook"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["refcheck"]

# The glossary is content rather than a tool, but it is generated content, so it needs
# something to run. One entry point is cheaper than a justfile recipe that knows how to
# import a module.
[project.scripts]
pyxray-glossary = "pyxray.glossary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxray"]

[tool.uv.sources]
refcheck = { workspace = true }
