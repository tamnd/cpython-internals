<svg xmlns="http://www.w3.org/2000/svg" width="890" height="818" viewBox="-24.0 -24.0 889.7 818.0" role="img" aria-label="the-handoff"><rect x="-24.0" y="-24.0" width="889.7" height="818.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="312.5" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="312.5" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="310.0" width="312.5" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="312.5" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="312.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="700.0" width="312.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><polyline points="156.2,120.0 156.2,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="156.2" y1="180.0" x2="162.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="156.2" y1="180.0" x2="150.2" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="156.2,250.0 156.2,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="156.2" y1="310.0" x2="162.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="156.2" y1="310.0" x2="150.2" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="156.2,380.0 156.2,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="156.2" y1="440.0" x2="162.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="156.2" y1="440.0" x2="150.2" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="156.2,510.0 156.2,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="156.2" y1="570.0" x2="162.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="156.2" y1="570.0" x2="150.2" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="156.2,640.0 156.2,700.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="156.2" y1="700.0" x2="162.3" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="156.2" y1="700.0" x2="150.2" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How the lock actually changes hands, and why it takes so long</text><text x="156.2" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a waiting thread asks</text><text x="156.2" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it waits out the interval</text><text x="156.2" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it sets the drop bit</text><text x="156.2" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the running thread checks</text><text x="156.2" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the running thread lets go</text><text x="156.2" y="739.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the waiting thread runs</text><text x="168.2" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">take_gil</text><text x="168.2" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">5 ms by default</text><text x="168.2" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">eval_breaker</text><text x="168.2" y="543.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">at a backward jump</text><text x="168.2" y="673.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">drop_gil</text></svg>
