<svg xmlns="http://www.w3.org/2000/svg" width="881" height="688" viewBox="-24.0 -24.0 880.9 688.0" role="img" aria-label="set-name-timing"><rect x="-24.0" y="-24.0" width="880.9" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="577.1" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="577.1" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="310.0" width="577.1" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="577.1" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="577.1" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="288.6,120.0 288.6,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.6" y1="180.0" x2="294.6" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.6" y1="180.0" x2="282.5" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="288.6,250.0 288.6,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.6" y1="310.0" x2="294.6" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.6" y1="310.0" x2="282.5" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="288.6,380.0 288.6,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.6" y1="440.0" x2="294.6" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.6" y1="440.0" x2="282.5" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="288.6,510.0 288.6,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.6" y1="570.0" x2="294.6" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.6" y1="570.0" x2="282.5" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How a descriptor learns the name it was assigned to</text><text x="288.6" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the class body runs and fills a dict</text><text x="288.6" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">type() builds the class from that dict</text><text x="288.6" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">type_new_set_names copies the dict and walks it</text><text x="288.6" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">every value with __set_name__ gets called</text><text x="288.6" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and it never runs again</text><text x="300.6" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">your descriptor exists but has no name yet</text><text x="300.6" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the copy is why you can add attributes inside __set_name__</text><text x="300.6" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">assign the same descriptor later and it stays nameless</text></svg>
