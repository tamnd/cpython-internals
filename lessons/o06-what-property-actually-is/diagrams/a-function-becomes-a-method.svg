<svg xmlns="http://www.w3.org/2000/svg" width="728" height="688" viewBox="-24.0 -24.0 727.6 688.0" role="img" aria-label="a-function-becomes-a-method"><rect x="-24.0" y="-24.0" width="727.6" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="562.4" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="562.4" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="310.0" width="562.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="562.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="562.4" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="281.2,120.0 281.2,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="281.2" y1="180.0" x2="287.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="281.2" y1="180.0" x2="275.1" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="281.2,250.0 281.2,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="281.2" y1="310.0" x2="287.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="281.2" y1="310.0" x2="275.1" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="281.2,380.0 281.2,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="281.2" y1="440.0" x2="287.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="281.2" y1="440.0" x2="275.1" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="281.2,510.0 281.2,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="281.2" y1="570.0" x2="287.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="281.2" y1="570.0" x2="275.1" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Where the self in your methods comes from</text><text x="281.2" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">def greet(self) in the class body</text><text x="281.2" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it lands in the class dict as a plain function</text><text x="281.2" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">g.greet reads it, finds __get__, calls it</text><text x="281.2" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">func_descr_get sees a real obj, not None</text><text x="281.2" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">PyMethod_New packs the function and g together</text><text x="293.2" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">nothing special has happened yet</text><text x="293.2" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">functions are non data descriptors</text><text x="293.2" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">on a class it returns the function unchanged</text></svg>
