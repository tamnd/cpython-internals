<svg xmlns="http://www.w3.org/2000/svg" width="874" height="444" viewBox="-24.0 -24.0 874.2 444.0" role="img" aria-label="what-it-can-know"><rect x="-24.0" y="-24.0" width="874.2" height="444.0" fill="#ffffff"/><polyline points="0.0,76.0 765.6,76.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,76.0 765.6,76.0 765.6,116.0 0.0,116.0 0.0,76.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 765.6,116.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 765.6,116.0 765.6,156.0 0.0,156.0 0.0,116.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 765.6,156.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 765.6,156.0 765.6,196.0 0.0,196.0 0.0,156.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 765.6,196.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 765.6,196.0 765.6,236.0 0.0,236.0 0.0,196.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 765.6,236.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 765.6,236.0 765.6,276.0 0.0,276.0 0.0,236.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 765.6,276.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 765.6,276.0 765.6,316.0 0.0,316.0 0.0,276.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,316.0 765.6,316.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,316.0 765.6,316.0 765.6,356.0 0.0,356.0 0.0,316.0" fill="#ffc9c9" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,356.0 765.6,356.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What the optimizer knows about one value, from least to most</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what it has been told</text><text x="272.4" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what that rules out</text><text x="482.8" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">how it found out</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nothing</text><text x="272.4" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nothing</text><text x="482.8" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a local it has not seen used</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">it is an object</text><text x="272.4" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">it is not empty</text><text x="482.8" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a null check went past</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">its type has not changed</text><text x="272.4" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a patched class</text><text x="482.8" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a version guard went past</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">its exact type</text><text x="272.4" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">every other type</text><text x="482.8" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a type guard went past</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">true or false</text><text x="272.4" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the other one</text><text x="482.8" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a truth test went past</text><text x="14.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the object itself</text><text x="272.4" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">everything else</text><text x="482.8" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a global that was baked in</text><text x="14.0" y="339.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nothing is possible</text><text x="272.4" y="339.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">all of it</text><text x="482.8" y="339.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">two guards that contradict</text><text x="0.0" y="389.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">It can only ever move down this list, never back up.</text></svg>
