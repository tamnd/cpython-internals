<svg xmlns="http://www.w3.org/2000/svg" width="800" height="614" viewBox="-24.0 -24.0 799.7 614.0" role="img" aria-label="how-tall-does-it-get"><rect x="-24.0" y="-24.0" width="799.7" height="614.0" fill="#ffffff"/><rect x="162.5" y="50.0" width="250.0" height="72.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="232.0" width="250.0" height="72.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="325.0" y="232.0" width="250.0" height="72.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="162.5" y="414.0" width="250.0" height="72.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="287.5,122.0 125.0,232.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="125.0" y1="232.0" x2="138.9" y2="230.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="125.0" y1="232.0" x2="132.0" y2="219.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="287.5,122.0 450.0,232.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="232.0" x2="443.0" y2="219.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="450.0" y1="232.0" x2="436.1" y2="230.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="125.0,304.0 287.5,414.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="287.5" y1="414.0" x2="280.5" y2="401.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="287.5" y1="414.0" x2="273.6" y2="412.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="450.0,304.0 287.5,414.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="287.5" y1="414.0" x2="301.4" y2="412.0" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="287.5" y1="414.0" x2="294.5" y2="401.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How the compiler works out co_stacksize</text><text x="287.5" y="79.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">test the condition</text><text x="287.5" y="99.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">deepest here: 1</text><text x="125.0" y="261.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the short branch</text><text x="125.0" y="281.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">deepest here: 2</text><text x="450.0" y="261.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the long branch</text><text x="450.0" y="281.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">deepest here: 5</text><text x="287.5" y="453.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">co_stacksize = 5</text><text x="102.8" y="217.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">False</text><text x="432.6" y="217.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">True</text><text x="0.0" y="519.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">The frame is allocated once, before anything runs, so it has to be big enough for the</text><text x="0.0" y="539.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">worst path through the function. The compiler walks every path and keeps the largest</text><text x="0.0" y="559.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">number it sees. Nobody measures anything while the program is running.</text></svg>
