<svg xmlns="http://www.w3.org/2000/svg" width="670" height="558" viewBox="-24.0 -24.0 670.1 558.0" role="img" aria-label="baked-in-and-thrown-away"><rect x="-24.0" y="-24.0" width="670.1" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="426.5" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="426.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="310.0" width="426.5" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="426.5" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><polyline points="213.2,120.0 213.2,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="213.2" y1="180.0" x2="219.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="213.2" y1="180.0" x2="207.2" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="213.2,250.0 213.2,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="213.2" y1="310.0" x2="219.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="213.2" y1="310.0" x2="207.2" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="213.2,380.0 213.2,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="213.2" y1="440.0" x2="219.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="213.2" y1="440.0" x2="207.2" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What a constant costs when it stops being one</text><text x="213.2" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the loop calls a global function</text><text x="213.2" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the function is copied into the trace</text><text x="213.2" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">you rebind the name</text><text x="213.2" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the executor is dropped</text><text x="225.2" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no lookup left</text><text x="225.2" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a watcher fires</text><text x="225.2" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">back to bytecode</text></svg>
