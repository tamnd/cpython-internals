[project]
name = "distprobe"
version = "0.1.0"
description = "Ask every Python a reader might have whether it ships the compiler hooks the lessons use"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
distprobe = "distprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distprobe"]
