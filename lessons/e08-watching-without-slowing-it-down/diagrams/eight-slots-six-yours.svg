roke-linejoin="round"/><polyline points="0.0,316.0 612.0,316.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The eight tool ids and who is expected to use them</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">id</text><text x="80.4" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">who has it</text><text x="406.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">how you get it</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">0</text><text x="80.4" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">debuggers, by convention</text><text x="406.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">DEBUGGER_ID</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">1</text><text x="80.4" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">coverage tools, by convention</text><text x="406.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">COVERAGE_ID</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">2</text><text x="80.4" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">profilers, by convention</text><text x="406.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">PROFILER_ID</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">3, 4</text><text x="80.4" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nobody, take one</text><text x="406.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the number itself</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">5</text><text x="80.4" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">optimizers, by convention</text><text x="406.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">OPTIMIZER_ID</text><text x="14.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">6, 7</text><text x="80.4" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">sys.setprofile and sys.settrace</text><text x="406.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">not available to you</text><text x="0.0" y="349.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">The names are only a convention. The interpreter checks the number, not the name.</text></svg>
