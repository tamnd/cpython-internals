<svg xmlns="http://www.w3.org/2000/svg" width="796" height="688" viewBox="-24.0 -24.0 796.1 688.0" role="img" aria-label="specialised-then-not"><rect x="-24.0" y="-24.0" width="796.1" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="511.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="511.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="511.7" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="511.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="511.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="255.8,120.0 255.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="255.8" y1="180.0" x2="261.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="255.8" y1="180.0" x2="249.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="255.8,250.0 255.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="255.8" y1="310.0" x2="261.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="255.8" y1="310.0" x2="249.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="255.8,380.0 255.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="255.8" y1="440.0" x2="261.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="255.8" y1="440.0" x2="249.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="255.8,510.0 255.8,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="255.8" y1="570.0" x2="261.9" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="255.8" y1="570.0" x2="249.8" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The bytecode rewrites itself around what it keeps seeing</text><text x="255.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">LOAD_ATTR, the general form</text><text x="255.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">after a few runs, LOAD_ATTR_INSTANCE_VALUE</text><text x="255.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">someone assigns a property to the class</text><text x="255.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the guard fails and it goes back to general</text><text x="255.8" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and settles on LOAD_ATTR_PROPERTY</text><text x="267.9" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the guard is the type version tag</text><text x="267.9" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which zeroes every version tag under it</text><text x="267.9" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no invalidation pass, just a check that stops matching</text></svg>
