f, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">count 1</text><text x="706.0" y="114.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">gone</text><text x="1016.0" y="114.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">gone</text><text x="856.0" y="188.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">other</text><text x="856.0" y="282.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">other</text><text x="0.0" y="322.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Both counts start at 2, one for the name and one for the other Node. Dropping both names</text><text x="0.0" y="342.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">takes each count down to 1 and stops there, because the two objects are still holding each</text><text x="0.0" y="362.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">other. Nothing else in the program can reach them and nothing will ever free them.</text></svg>
