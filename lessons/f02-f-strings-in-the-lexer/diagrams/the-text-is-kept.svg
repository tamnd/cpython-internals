<svg xmlns="http://www.w3.org/2000/svg" width="1017" height="818" viewBox="-24.0 -24.0 1016.8 818.0" role="img" aria-label="the-text-is-kept"><rect x="-24.0" y="-24.0" width="1016.8" height="818.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="565.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="565.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="310.0" width="565.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="565.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="565.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="700.0" width="565.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="282.8,120.0 282.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="282.8" y1="180.0" x2="288.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="282.8" y1="180.0" x2="276.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="282.8,250.0 282.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="282.8" y1="310.0" x2="288.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="282.8" y1="310.0" x2="276.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="282.8,380.0 282.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="282.8" y1="440.0" x2="288.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="282.8" y1="440.0" x2="276.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="282.8,510.0 282.8,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="282.8" y1="570.0" x2="288.9" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="282.8" y1="570.0" x2="276.8" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="282.8,640.0 282.8,700.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="282.8" y1="700.0" x2="288.9" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="282.8" y1="700.0" x2="276.8" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How the printed form of your expression survives all the way to run time</text><text x="282.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">you write f"{x + 1 = }"</text><text x="282.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the lexer copies the characters as it scans them</text><text x="282.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">last_expr_buffer, a private copy of your source</text><text x="282.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">set_ftstring_expr hangs it on the token</text><text x="282.8" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the AST carries the text next to the expression</text><text x="282.8" y="739.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the printed result is x + 1 = 2</text><text x="294.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one character at a time</text><text x="294.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">until a colon, a bang or a closing brace</text><text x="294.8" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">as token metadata</text><text x="294.8" y="543.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">compiled into a constant</text></svg>
