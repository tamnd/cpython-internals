[project]
name = "wasmprobe"
version = "0.1.0"
description = "Ask a browser Python which of the introspection surfaces this project needs actually work"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
wasmprobe = "wasmprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasmprobe"]
