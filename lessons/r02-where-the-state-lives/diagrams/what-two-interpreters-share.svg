" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">None</text><text x="358.8" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">yes</text><text x="502.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the runtime, at startup</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the bool True</text><text x="358.8" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">yes</text><text x="502.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the runtime, at startup</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the int 5</text><text x="358.8" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">yes</text><text x="502.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the runtime, at startup</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the int 100000</text><text x="358.8" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">no</text><text x="502.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">each interpreter, on demand</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the string a</text><text x="358.8" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">yes</text><text x="502.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the runtime, at startup</text><text x="14.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the string startup</text><text x="358.8" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">no</text><text x="502.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">each interpreter, when compiled</text><text x="14.0" y="339.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="sta