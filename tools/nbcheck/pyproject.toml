[project]
name = "nbcheck"
version = "0.1.0"
description = "Structural checks and execution for the lesson notebooks"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
nbcheck = "nbcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbcheck"]
