<svg xmlns="http://www.w3.org/2000/svg" width="805" height="688" viewBox="-24.0 -24.0 805.4 688.0" role="img" aria-label="how-eq-loses-hash"><rect x="-24.0" y="-24.0" width="805.4" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="550.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="550.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="550.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="440.0" width="550.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="550.7" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="275.3,120.0 275.3,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="275.3" y1="180.0" x2="281.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="275.3" y1="180.0" x2="269.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="275.3,250.0 275.3,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="275.3" y1="310.0" x2="281.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="275.3" y1="310.0" x2="269.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="275.3,380.0 275.3,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="275.3" y1="440.0" x2="281.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="275.3" y1="440.0" x2="269.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="275.3,510.0 275.3,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="275.3" y1="570.0" x2="281.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="275.3" y1="570.0" x2="269.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Three steps between defining __eq__ and unhashable type</text><text x="275.3" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">you define __eq__ and not __hash__</text><text x="275.3" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">overrides_hash sees __eq__ in the class dict</text><text x="275.3" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">so tp_hash is not copied down from the base</text><text x="275.3" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">type_ready_set_hash finds it still empty</text><text x="275.3" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and writes __hash__ = None into the class dict</text><text x="287.3" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which is the only question it asks</text><text x="287.3" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">and neither is tp_richcompare</text><text x="287.3" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so the None you see is real, not a rule</text></svg>
