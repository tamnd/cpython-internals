<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="248" viewBox="-24.0 -24.0 1052.0 248.0" role="img" aria-label="two-gates"><rect x="-24.0" y="-24.0" width="1052.0" height="248.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="206.0" height="80.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="266.0" y="50.0" width="206.0" height="80.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="532.0" y="50.0" width="206.0" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="798.0" y="50.0" width="206.0" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><polyline points="206.0,90.0 266.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.0" y1="90.0" x2="253.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.0" y1="90.0" x2="253.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="472.0,90.0 532.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="532.0" y1="90.0" x2="519.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="532.0" y1="90.0" x2="519.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="738.0,90.0 798.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="798.0" y1="90.0" x2="785.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="798.0" y1="90.0" x2="785.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What an extension has to get past before it is a module</text><text x="103.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a file turns up</text><text x="45.4" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">mod.abi3t.so</text><text x="369.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">read the name</text><text x="306.6" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a tag I take?</text><text x="635.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">open and run it</text><text x="553.4" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">dlopen, then init</text><text x="901.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">check the struct</text><text x="833.8" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">numbers agree?</text><text x="0.0" y="193.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">The first gate costs one stat call. The second one has already run the extension's code.</text></svg>
