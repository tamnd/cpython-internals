<svg xmlns="http://www.w3.org/2000/svg" width="808" height="548" viewBox="-24.0 -24.0 808.3 548.0" role="img" aria-label="one-box-two-frames"><rect x="-24.0" y="-24.0" width="808.3" height="548.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="260.0" height="150.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="16.0" y="106.0" width="228.0" height="56.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="290.0" width="260.0" height="150.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="16.0" y="346.0" width="228.0" height="56.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="410.0" y="170.0" width="170.0" height="140.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="260.0,125.0 410.0,240.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="410.0" y1="240.0" x2="403.7" y2="227.5" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="410.0" y1="240.0" x2="396.3" y2="237.2" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="260.0,365.0 410.0,240.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="410.0" y1="240.0" x2="396.4" y2="243.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="410.0" y1="240.0" x2="404.2" y2="252.7" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What a closure actually shares</text><text x="16.0" y="71.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1971c2" text-anchor="start" xml:space="preserve">outer's frame</text><text x="32.0" y="137.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">total   cell 0</text><text x="16.0" y="311.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#6741d9" text-anchor="start" xml:space="preserve">inner's frame</text><text x="32.0" y="377.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">total   free 0</text><text x="495.0" y="223.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">cell</text><text x="495.0" y="243.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"></text><text x="495.0" y="263.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">value: 0</text><text x="0.0" y="473.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Both frames hold the same cell, so writing through one is visible through the other.</text><text x="0.0" y="493.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">outer returns and its frame goes away. The cell does not, because inner still holds it.</text></svg>
