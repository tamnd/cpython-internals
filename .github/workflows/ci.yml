name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_TAG: v3.15.0rc1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned version is what every citation and every claim is written against,
        # so it is the version that must pass. 3.14 runs too because Pyodide is a release
        # behind, and a lesson that only works on the pin is a lesson the browser tier
        # cannot run.
        python: ["3.15.0rc1", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The checked in .python-version holds the pin, so the matrix has to overwrite it
      # rather than sit next to it, or both legs of the matrix run the same interpreter
      # and the job quietly stops testing what it says it tests.
      - run: uv python pin ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run pytest

  notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same reasoning as the test job. The lessons are written on the pin and read on
        # whatever the browser tier is running, so both have to execute every cell.
        python: ["3.15.0rc1", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv python pin ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run python -c "import sys; print(sys.version)"
      # Every notebook is generated from the build.py next to it and also committed, because
      # a reader clicking a Colab badge cannot run a build step first. This is the step that
      # stops the two from drifting after somebody edits a cell in Jupyter and commits it.
      - run: uv run nbbuild check
      # Same argument one level down: a lesson embeds its diagrams as images served from
      # this repository, so the committed SVG has to still be what the script draws.
      - run: uv run nbdiagram check
      - run: uv run nbcheck lint
      # The notebooks install pyxray from this repository when they run in Colab. Here the
      # workspace copy is already installed, so what gets executed is the working tree and
      # not whatever is on main, which is the whole point of running them in a pull request.
      - run: uv run nbcheck run

  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # A blobless shallow clone is a few hundred megabytes rather than several
      # gigabytes, and it is enough to resolve every citation.
      - name: Cache the pinned CPython tree
        id: cpython-cache
        uses: actions/cache@v4
        with:
          path: vendor/cpython
          key: cpython-${{ env.PINNED_TAG }}-v1
      - name: Fetch the pinned CPython tree
        if: steps.cpython-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PINNED_TAG" --filter=blob:none \
            https://github.com/python/cpython.git vendor/cpython

      - name: Confirm the tree is the commit we pinned
        run: |
          expected=$(uv run python -c "import sys; sys.path.insert(0, 'tools/refcheck/src'); from refcheck.tree import PINNED_COMMIT; print(PINNED_COMMIT)")
          actual=$(git -C vendor/cpython rev-parse HEAD)
          if [ "$expected" != "$actual" ]; then
            echo "pinned tree is $actual but refcheck expects $expected"
            exit 1
          fi

      - run: uv sync --all-packages
      - run: uv run pytest tools/refcheck/tests
      - run: uv run refcheck verify
