<svg xmlns="http://www.w3.org/2000/svg" width="953" height="248" viewBox="-26.5 -24.0 952.5 248.0" role="img" aria-label="the-order-of-the-end"><rect x="-26.5" y="-24.0" width="952.5" height="248.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="177.5" height="80.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="237.5" y="50.0" width="177.5" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="475.0" y="50.0" width="177.5" height="80.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="712.5" y="50.0" width="177.5" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><polyline points="177.5,90.0 237.5,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="237.5" y1="90.0" x2="224.9" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="237.5" y1="90.0" x2="224.9" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="415.0,90.0 475.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="475.0" y1="90.0" x2="462.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="475.0" y1="90.0" x2="462.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="652.5,90.0 712.5,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="712.5" y1="90.0" x2="699.9" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="712.5" y1="90.0" x2="699.9" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What happens after your last line, in the order it happens</text><text x="88.8" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">your last line</text><text x="-2.5" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the program is done</text><text x="326.2" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">threads</text><text x="230.2" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">non daemon ones join</text><text x="563.8" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">atexit</text><text x="462.9" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">newest callback first</text><text x="801.2" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the sweep</text><text x="700.5" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">modules, then objects</text><text x="0.0" y="193.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Only the first two steps run with a normal interpreter underneath them.</text></svg>
