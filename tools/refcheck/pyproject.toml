[project]
name = "refcheck"
version = "0.1.0"
description = "Verify that every citation of CPython source still points at what it claimed to"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
refcheck = "refcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refcheck"]
