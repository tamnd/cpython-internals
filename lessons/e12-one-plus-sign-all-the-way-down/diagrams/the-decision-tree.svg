<svg xmlns="http://www.w3.org/2000/svg" width="766" height="404" viewBox="-24.0 -24.0 765.6 404.0" role="img" aria-label="the-decision-tree"><rect x="-24.0" y="-24.0" width="765.6" height="404.0" fill="#ffffff"/><polyline points="0.0,76.0 717.6,76.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,76.0 717.6,76.0 717.6,116.0 0.0,116.0 0.0,76.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 717.6,116.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 717.6,116.0 717.6,156.0 0.0,156.0 0.0,116.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 717.6,156.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 717.6,156.0 717.6,196.0 0.0,196.0 0.0,156.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 717.6,196.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 717.6,196.0 717.6,236.0 0.0,236.0 0.0,196.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 717.6,236.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 717.6,236.0 717.6,276.0 0.0,276.0 0.0,236.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 717.6,276.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 717.6,276.0 717.6,316.0 0.0,316.0 0.0,276.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,316.0 717.6,316.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The same plus sign, six answers</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what you add</text><text x="157.2" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what it becomes</text><text x="463.6" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">why</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">1 + 2</text><text x="157.2" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP_ADD_INT</text><text x="463.6" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">both small ints</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">1.5 + 2.5</text><text x="157.2" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP_ADD_FLOAT</text><text x="463.6" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">both floats</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">'a' + 'b'</text><text x="157.2" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP_ADD_UNICODE</text><text x="463.6" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">both strings</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">s = s + 'b'</text><text x="157.2" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP_INPLACE_ADD_UNICODE</text><text x="463.6" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the result goes back to s</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">1 + 2.5</text><text x="157.2" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP_EXTEND</text><text x="463.6" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the two types differ</text><text x="14.0" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">9 / 4</text><text x="157.2" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">BINARY_OP</text><text x="463.6" y="299.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">division has no fast path</text><text x="0.0" y="349.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Decided once, a few hundred trips in, by looking at what actually turned up.</text></svg>
