" stroke-width="2" stroke-linecap="round"/><line x1="896.1" y1="90.0" x2="883.5" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="1134.8,90.0 1194.8,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="1194.8" y1="90.0" x2="1182.2" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="1194.8" y1="90.0" x2="1182.2" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="1433.5,90.0 1493.5,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="1493.5" y1="90.0" x2="1480.9" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="1493.5" y1="90.0" x2="1480.9" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="1732.2,90.0 1792.2,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="1792.2" y1="90.0" x2="1779.6" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="1792.2" y1="90.0" x2="1779.6" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="2030.9,90.0 2090.9,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="2090.9" y1="90.0" x2="2078.3" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="2090.9" y1="90.0" x2="2078.3" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">One line, end to end, with the real artefact at every box</text><text x="119.4" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">answer = 6 * 7</text><text x="52.2" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">1 line of text</text><text x="418.1" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">NAME OP NUMBER</text><text x="379.7" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">8 tokens</text><text x="716.8" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Assign(BinOp)</text><text x="683.2" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">8 nodes</text><text x="1015.5" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">answer: global</text><text x="986.7" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">1 name</text><text x="1314.2" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">BINARY_OP 5</text><text x="1247.0" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">8 instructions</text><text x="1612.9" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">LOAD_SMALL_INT 42</text><text x="1545.7" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">5 instructions</text><text x="1911.6" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">co_consts (6,)</text><text x="1854.0" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the leftover</text><text x="2210.3" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">answer == 42</text><text x="2162.3" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the effect</text><text x="0.0" y="193.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">The multiplication is gone by the sixth box, so nothing at run time ever does the sum. The 6 is still sitting in co_consts because codegen put it there before the optimizer folded it away, and nobody goes back to tidy up.</text></svg>
