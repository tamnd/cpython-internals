<svg xmlns="http://www.w3.org/2000/svg" width="936" height="558" viewBox="-24.0 -24.0 936.5 558.0" role="img" aria-label="a-parameter-becomes-a-cell"><rect x="-24.0" y="-24.0" width="936.5" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="549.5" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="549.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="549.5" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="440.0" width="549.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="274.8,120.0 274.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="274.8" y1="180.0" x2="280.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="274.8" y1="180.0" x2="268.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="274.8,250.0 274.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="274.8" y1="310.0" x2="280.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="274.8" y1="310.0" x2="268.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="274.8,380.0 274.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="274.8" y1="440.0" x2="280.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="274.8" y1="440.0" x2="268.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Why the first two instructions of a function can run before line one</text><text x="274.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a arrives in slot 0, an ordinary parameter</text><text x="274.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">MAKE_CELL 0 runs before anything else</text><text x="274.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">slot 0 now holds a cell with a inside it</text><text x="274.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the nested function gets the cell, not the value</text><text x="286.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">tagged both local and cell</text><text x="286.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which is what makes the closure work</text></svg>
