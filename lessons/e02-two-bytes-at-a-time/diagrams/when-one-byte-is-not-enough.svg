<svg xmlns="http://www.w3.org/2000/svg" width="879" height="558" viewBox="-24.0 -24.0 878.9 558.0" role="img" aria-label="when-one-byte-is-not-enough"><rect x="-24.0" y="-24.0" width="878.9" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="463.4" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="463.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="463.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="463.4" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="231.7,120.0 231.7,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="231.7" y1="180.0" x2="237.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="231.7" y1="180.0" x2="225.6" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="231.7,250.0 231.7,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="231.7" y1="310.0" x2="237.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="231.7" y1="310.0" x2="225.6" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="231.7,380.0 231.7,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="231.7" y1="440.0" x2="237.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="231.7" y1="440.0" x2="225.6" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How an argument bigger than 255 gets through a one byte field</text><text x="231.7" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">EXTENDED_ARG 1 sits in front</text><text x="231.7" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it shifts its own argument left by eight</text><text x="231.7" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">then reads the next opcode itself</text><text x="231.7" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">STORE_FAST 0 becomes STORE_FAST 256</text><text x="243.7" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the compiler puts it there, up to three of them</text><text x="243.7" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">1 becomes 256</text><text x="243.7" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">without going back round the loop</text></svg>
