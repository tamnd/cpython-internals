<svg xmlns="http://www.w3.org/2000/svg" width="822" height="558" viewBox="-24.0 -24.0 822.4 558.0" role="img" aria-label="two-into-one"><rect x="-24.0" y="-24.0" width="822.4" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="533.0" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="533.0" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="310.0" width="533.0" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="440.0" width="533.0" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="266.5,120.0 266.5,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.5" y1="180.0" x2="272.6" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.5" y1="180.0" x2="260.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="266.5,250.0 266.5,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.5" y1="310.0" x2="272.6" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.5" y1="310.0" x2="260.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="266.5,380.0 266.5,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.5" y1="440.0" x2="272.6" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.5" y1="440.0" x2="260.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Two instructions become one, if two small conditions hold</text><text x="266.5" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">LOAD_FAST a, LOAD_FAST b, next to each other</text><text x="266.5" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">are they on the same line of source</text><text x="266.5" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">are both slot numbers under 16</text><text x="266.5" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">LOAD_FAST_LOAD_FAST, one instruction</text><text x="278.5" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">put a line break between them and you lose it</text><text x="278.5" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the two slots share one operand byte</text></svg>
