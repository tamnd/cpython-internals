<svg xmlns="http://www.w3.org/2000/svg" width="1577" height="248" viewBox="-24.0 -24.0 1577.3 248.0" role="img" aria-label="a-call-in-four-moves"><rect x="-24.0" y="-24.0" width="1577.3" height="248.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="176.0" height="80.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="236.0" y="50.0" width="176.0" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="472.0" y="50.0" width="176.0" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="708.0" y="50.0" width="176.0" height="80.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><polyline points="176.0,90.0 236.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.0" y1="90.0" x2="223.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.0" y1="90.0" x2="223.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="412.0,90.0 472.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="472.0" y1="90.0" x2="459.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="472.0" y1="90.0" x2="459.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="648.0,90.0 708.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="708.0" y1="90.0" x2="695.4" y2="83.9" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="708.0" y1="90.0" x2="695.4" y2="96.1" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What happens when Python calls Python</text><text x="88.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">CALL</text><text x="30.4" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">push a frame</text><text x="324.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jump</text><text x="261.6" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">to the callee</text><text x="560.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">run</text><text x="497.6" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the same loop</text><text x="796.0" y="94.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">RETURN_VALUE</text><text x="733.6" y="153.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">pop the frame</text><text x="0.0" y="193.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">No C function is entered and nothing recurses. The interpreter pushes a frame on the data stack, jumps to the callee's first instruction, and keeps going round the same loop.</text></svg>
