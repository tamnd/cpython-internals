<svg xmlns="http://www.w3.org/2000/svg" width="611" height="688" viewBox="-24.0 -24.0 611.2 688.0" role="img" aria-label="the-order-a-collection-runs-in"><rect x="-24.0" y="-24.0" width="611.2" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="430.4" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="430.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="430.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="430.4" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="570.0" width="430.4" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="215.2,120.0 215.2,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="215.2" y1="180.0" x2="221.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="215.2" y1="180.0" x2="209.1" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="215.2,250.0 215.2,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="215.2" y1="310.0" x2="221.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="215.2" y1="310.0" x2="209.1" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="215.2,380.0 215.2,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="215.2" y1="440.0" x2="221.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="215.2" y1="440.0" x2="209.1" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="215.2,510.0 215.2,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="215.2" y1="570.0" x2="221.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="215.2" y1="570.0" x2="209.1" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Five steps, in this order, every collection</text><text x="215.2" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">run the weakref callbacks</text><text x="215.2" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">run the finalizers</text><text x="215.2" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">check what came back to life</text><text x="215.2" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">break the remaining weak references</text><text x="215.2" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">clear the objects and free them</text><text x="227.2" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so a callback fires before any __del__</text><text x="227.2" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">each one at most once, ever</text><text x="227.2" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">survivors move to the old generation</text><text x="227.2" y="543.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no callbacks this time</text></svg>
