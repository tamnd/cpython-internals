<svg xmlns="http://www.w3.org/2000/svg" width="711" height="688" viewBox="-24.0 -24.0 711.4 688.0" role="img" aria-label="super-follows-the-instance"><rect x="-24.0" y="-24.0" width="711.4" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="494.9" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="494.9" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="494.9" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="440.0" width="494.9" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="494.9" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="247.4,120.0 247.4,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="247.4" y1="180.0" x2="253.5" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="247.4" y1="180.0" x2="241.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="247.4,250.0 247.4,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="247.4" y1="310.0" x2="253.5" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="247.4" y1="310.0" x2="241.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="247.4,380.0 247.4,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="247.4" y1="440.0" x2="253.5" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="247.4" y1="440.0" x2="241.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="247.4,510.0 247.4,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="247.4" y1="570.0" x2="253.5" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="247.4" y1="570.0" x2="241.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Why super is not a shortcut for the base class</text><text x="247.4" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">super().who() inside Left</text><text x="247.4" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">look at the instance, not at Left</text><text x="247.4" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">find Left in that instance's MRO</text><text x="247.4" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">take whatever is next in the list</text><text x="247.4" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">which may be a class Left never heard of</text><text x="259.4" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">type(self), which Left cannot know in advance</text><text x="259.4" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so the answer changes per instance</text><text x="259.4" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one step, no search</text></svg>
