[project]
name = "cpybuild"
version = "0.1.0"
description = "The five CPython builds the lessons point at, and the lockfile that names them by digest"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["refcheck"]

[project.scripts]
cpybuild = "cpybuild.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpybuild"]

[tool.uv.sources]
refcheck = { workspace = true }
