<svg xmlns="http://www.w3.org/2000/svg" width="630" height="558" viewBox="-24.0 -24.0 629.7 558.0" role="img" aria-label="when-a-borrow-is-promoted"><rect x="-24.0" y="-24.0" width="629.7" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="429.5" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="429.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="429.5" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="429.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="214.8,120.0 214.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="214.8" y1="180.0" x2="220.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="214.8" y1="180.0" x2="208.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="214.8,250.0 214.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="214.8" y1="310.0" x2="220.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="214.8" y1="310.0" x2="208.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="214.8,380.0 214.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="214.8" y1="440.0" x2="220.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="214.8" y1="440.0" x2="208.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How the compiler decides</text><text x="214.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the compiler wants to load a local</text><text x="214.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">does the value escape into the heap</text><text x="214.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">if it does, load it owned</text><text x="214.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">if it does not, load it borrowed</text><text x="226.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a list, a frame, a generator, another slot</text><text x="226.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">LOAD_FAST, and a counted reference</text><text x="226.8" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">LOAD_FAST_BORROW, and no counting</text></svg>
