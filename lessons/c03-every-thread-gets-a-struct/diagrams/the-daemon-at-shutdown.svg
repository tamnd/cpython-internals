<svg xmlns="http://www.w3.org/2000/svg" width="1019" height="688" viewBox="-24.0 -24.0 1018.6 688.0" role="img" aria-label="the-daemon-at-shutdown"><rect x="-24.0" y="-24.0" width="1018.6" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="507.2" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="507.2" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="310.0" width="507.2" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="440.0" width="507.2" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="507.2" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><polyline points="253.6,120.0 253.6,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="253.6" y1="180.0" x2="259.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="253.6" y1="180.0" x2="247.5" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="253.6,250.0 253.6,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="253.6" y1="310.0" x2="259.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="253.6" y1="310.0" x2="247.5" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="253.6,380.0 253.6,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="253.6" y1="440.0" x2="259.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="253.6" y1="440.0" x2="247.5" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="253.6,510.0 253.6,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="253.6" y1="570.0" x2="259.7" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="253.6" y1="570.0" x2="247.5" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What happens to a daemon thread that is still working when Python exits</text><text x="253.6" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the main thread returns</text><text x="253.6" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">shutdown stores 3 into every other state</text><text x="253.6" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the daemon reaches its next periodic check</text><text x="253.6" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it tries to attach and reads the 3</text><text x="253.6" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the thread is hung where it stands</text><text x="265.6" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so finalize starts</text><text x="265.6" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one atomic store each</text><text x="265.6" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">and tries to attach</text><text x="265.6" y="543.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">for good</text></svg>
