<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="364" viewBox="-24.0 -24.0 1064.6 364.0" role="img" aria-label="frozen-but-not-hidden"><rect x="-24.0" y="-24.0" width="1064.6" height="364.0" fill="#ffffff"/><polyline points="0.0,76.0 689.6,76.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,76.0 689.6,76.0 689.6,116.0 0.0,116.0 0.0,76.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 689.6,116.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 689.6,116.0 689.6,156.0 0.0,156.0 0.0,116.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 689.6,156.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 689.6,156.0 689.6,196.0 0.0,196.0 0.0,156.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 689.6,196.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 689.6,196.0 689.6,236.0 0.0,236.0 0.0,196.0" fill="#ffd8a8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 689.6,236.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 689.6,236.0 689.6,276.0 0.0,276.0 0.0,236.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 689.6,276.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">A frozen module knows where it came from, even though it never went there</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what you ask for</text><text x="349.2" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">what you get back</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">os.__spec__.origin</text><text x="349.2" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">frozen</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">os.__spec__.cached</text><text x="349.2" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">None, because no pyc was involved</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">os.__file__</text><text x="349.2" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the real path to os.py</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">os.makedirs.__code__.co_filename</text><text x="349.2" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">&lt;frozen os&gt;</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">inspect.getsource(os.makedirs)</text><text x="349.2" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">the source, found through __file__</text><text x="0.0" y="309.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">The path on the spec is what lets tracebacks and pdb show you real lines.</text></svg>
