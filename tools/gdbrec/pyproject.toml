[project]
name = "gdbrec"
version = "0.1.0"
description = "Real gdb sessions against the debug build, recorded so a reader without gdb can read one"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["cpybuild"]

[project.scripts]
gdbrec = "gdbrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdbrec"]

[tool.uv.sources]
cpybuild = { workspace = true }
