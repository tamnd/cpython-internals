<svg xmlns="http://www.w3.org/2000/svg" width="732" height="688" viewBox="-24.0 -24.0 731.6 688.0" role="img" aria-label="where-a-key-lands"><rect x="-24.0" y="-24.0" width="731.6" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="545.6" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="545.6" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="545.6" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="545.6" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="570.0" width="545.6" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="272.8,120.0 272.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="272.8" y1="180.0" x2="278.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="272.8" y1="180.0" x2="266.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="272.8,250.0 272.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="272.8" y1="310.0" x2="278.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="272.8" y1="310.0" x2="266.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="272.8,380.0 272.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="272.8" y1="440.0" x2="278.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="272.8" y1="440.0" x2="266.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="272.8,510.0 272.8,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="272.8" y1="570.0" x2="278.9" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="272.8" y1="570.0" x2="266.7" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Finding a slot, which is usually the first thing tried</text><text x="272.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">hash(key), a whole machine word</text><text x="272.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">keep the low bits: i = hash &amp; mask</text><text x="272.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">read dk_indices[i]</text><text x="272.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">-1 means the key is not here, stop</text><text x="272.8" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">otherwise compare, and on a miss probe again</text><text x="284.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">for a size 8 table, mask is 7</text><text x="284.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one byte read for a small dict</text><text x="284.8" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">this is the answer for every failed lookup</text></svg>
