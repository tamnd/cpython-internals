<svg xmlns="http://www.w3.org/2000/svg" width="581" height="688" viewBox="-24.0 -24.0 580.7 688.0" role="img" aria-label="what-the-optimizer-does-to-a-trace"><rect x="-24.0" y="-24.0" width="580.7" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="532.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="532.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="532.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="532.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="532.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="266.4,120.0 266.4,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.4" y1="180.0" x2="272.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.4" y1="180.0" x2="260.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="266.4,250.0 266.4,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.4" y1="310.0" x2="272.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.4" y1="310.0" x2="260.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="266.4,380.0 266.4,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.4" y1="440.0" x2="272.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.4" y1="440.0" x2="260.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="266.4,510.0 266.4,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="266.4" y1="570.0" x2="272.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="266.4" y1="570.0" x2="260.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Two passes over a straight line</text><text x="266.4" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a trace, recorded from one real trip</text><text x="266.4" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">walk it holding descriptions instead of values</text><text x="266.4" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">drop the checks that cannot fail</text><text x="266.4" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">drop the bookkeeping nobody reads</text><text x="266.4" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a shorter trace, same behaviour</text><text x="278.4" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">nothing runs</text><text x="278.4" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">first pass</text><text x="278.4" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">second pass</text></svg>
