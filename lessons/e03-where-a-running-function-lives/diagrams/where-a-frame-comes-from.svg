<svg xmlns="http://www.w3.org/2000/svg" width="664" height="558" viewBox="-24.0 -24.0 663.5 558.0" role="img" aria-label="where-a-frame-comes-from"><rect x="-24.0" y="-24.0" width="663.5" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="615.5" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="615.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="615.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="615.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="307.8,120.0 307.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="307.8" y1="180.0" x2="313.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="307.8" y1="180.0" x2="301.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="307.8,250.0 307.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="307.8" y1="310.0" x2="313.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="307.8" y1="310.0" x2="301.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="307.8,380.0 307.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="307.8" y1="440.0" x2="313.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="307.8" y1="440.0" x2="301.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Making a frame is moving a pointer</text><text x="307.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a Python function is called</text><text x="307.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the interpreter takes the next slots off the data stack</text><text x="307.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it fills them in and starts running</text><text x="307.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">on return the slots are handed straight back</text><text x="319.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no C function is entered</text><text x="319.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a bump, or a new 16 KiB chunk</text><text x="319.8" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no allocation, no object created</text></svg>
