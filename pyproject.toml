[project]
name = "cpython-internals"
version = "0.0.0"
description = "A visual teardown of CPython 3.15, and a specification you can reimplement from"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

dependencies = [
    "bpcheck",
    "nbbuild",
    "nbcheck",
    "nbdiagram",
    "pyxray",
    "refcheck",
    "xraymanim",
    "xraywidgets",
]

# Installing the renderer. Manim brings cairo, pango, numpy and scipy with it, which is a
# lot to ask of a job that only wants to lint a notebook, so the animations are the one
# thing here you have to opt into: `uv sync --extra anim`, or `just build-animations`.
[project.optional-dependencies]
anim = ["xraymanim[render]"]
# The widgets that respond to a click. Everything in `xraywidgets` renders as plain HTML
# without this, so a reader who skips it still gets the picture, just not the buttons.
live = ["xraywidgets[live]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = [
    "pyxray",
    "tools/bpcheck",
    "tools/nbbuild",
    "tools/nbcheck",
    "tools/nbdiagram",
    "tools/refcheck",
    "xraymanim",
    "xraywidgets",
]

[tool.uv.sources]
bpcheck = { workspace = true }
nbbuild = { workspace = true }
nbcheck = { workspace = true }
nbdiagram = { workspace = true }
pyxray = { workspace = true }
refcheck = { workspace = true }
xraymanim = { workspace = true }
xraywidgets = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "pyxray/tests",
    "tools/bpcheck/tests",
    "tools/nbbuild/tests",
    "tools/nbcheck/tests",
    "tools/nbdiagram/tests",
    "tools/refcheck/tests",
    "xraymanim/tests",
    "xraywidgets/tests",
]
addopts = "-q --strict-markers --strict-config"
markers = [
    "pinned: needs the pinned CPython source tree",
    "freethreaded: needs a free threaded build",
]
filterwarnings = [
    "error",
    # Manim pulls in pydub, whose module body has an invalid escape sequence in it. The
    # warning fires the first time the file is compiled and not once there is a .pyc, so
    # leaving it as an error makes the animation tests fail on a cold cache and pass on a
    # warm one, which is the worst kind of test.
    "ignore:invalid escape sequence:SyntaxWarning",
    "ignore:.*is an invalid escape sequence:SyntaxWarning",
    # Manim parses the SVG it renders text into with `xml.etree.iterparse` and never closes
    # the iterator, so the warning fires from a destructor at an arbitrary later moment.
    # Left as an error it does not fail the test that caused it, it fails whichever test
    # happened to be running when the garbage collector got round to it.
    "ignore:unclosed iterparse iterator:ResourceWarning",
]

[tool.ruff.lint.isort]
known-first-party = [
    "bpcheck",
    "nbbuild",
    "nbcheck",
    "nbdiagram",
    "pyxray",
    "refcheck",
    "xraymanim",
    "xraywidgets",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The instrumentation packages deliberately touch private interpreter internals, and
    # renaming those to satisfy a linter would make them stop matching CPython's own names.
    "N802",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
# A lesson builder is mostly prose in triple quoted strings, and the project writes one
# paragraph per line so that a sentence is never split across two of them. Wrapping those
# to satisfy a line length rule would break the thing the rule is there to protect.
"lessons/**/build.py" = ["E501"]
# The glossary is the same thing without the notebook around it: definitions written as
# one paragraph per line, so that a sentence is never split across two of them.
"pyxray/src/pyxray/glossary.py" = ["E501"]
# Every word a widget shows a reader lives in one dictionary, written one sentence per line.
# Splitting a sentence across two source lines to please a line length rule would leave the
# sentence looking wrapped in the source and identical on screen, which helps nobody.
"xraywidgets/src/xraywidgets/strings.py" = ["E501"]
"lessons/**/diagrams.py" = ["E501"]
# The lesson notebooks are the one thing here that runs on an interpreter we do not choose.
# A reader in Colab is on whatever Google installed, so a version check the linter thinks
# is dead code is the cell that tells them why nothing below works.
"lessons/**/*.ipynb" = ["UP036"]
