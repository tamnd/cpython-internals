<svg xmlns="http://www.w3.org/2000/svg" width="789" height="688" viewBox="-24.0 -24.0 789.2 688.0" role="img" aria-label="a-class-is-different"><rect x="-24.0" y="-24.0" width="789.2" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="539.6" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="539.6" height="82.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="539.6" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="539.6" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="539.6" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="269.8,120.0 269.8,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="269.8" y1="180.0" x2="275.9" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="269.8" y1="180.0" x2="263.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="269.8,262.0 269.8,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="269.8" y1="310.0" x2="275.9" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="269.8" y1="310.0" x2="263.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="269.8,380.0 269.8,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="269.8" y1="440.0" x2="275.9" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="269.8" y1="440.0" x2="263.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="269.8,510.0 269.8,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="269.8" y1="570.0" x2="275.9" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="269.8" y1="570.0" x2="263.7" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Looking a name up on a class takes a different function</text><text x="269.8" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Klass.name, and type_getattro gets called</text><text x="269.8" y="213.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">walk type(Klass).__mro__, the metaclass</text><text x="269.8" y="238.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">chain</text><text x="269.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">found a data descriptor there, call it</text><text x="269.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">otherwise walk Klass.__mro__ itself</text><text x="269.8" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and call __get__ with None as the instance</text><text x="281.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the metaclass comes first, not the class</text><text x="281.8" y="289.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">this is how a metaclass property works</text><text x="281.8" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the same MRO walk, one level down</text></svg>
