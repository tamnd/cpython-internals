<svg xmlns="http://www.w3.org/2000/svg" width="787" height="558" viewBox="-24.0 -24.0 787.1 558.0" role="img" aria-label="how-the-collector-uses-traverse"><rect x="-24.0" y="-24.0" width="787.1" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="576.5" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="180.0" width="576.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="576.5" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="576.5" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="288.2,120.0 288.2,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.2" y1="180.0" x2="294.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.2" y1="180.0" x2="282.2" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="288.2,250.0 288.2,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.2" y1="310.0" x2="294.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.2" y1="310.0" x2="282.2" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="288.2,380.0 288.2,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="288.2" y1="440.0" x2="294.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="288.2" y1="440.0" x2="282.2" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Why an incomplete tp_traverse leaks instead of crashing</text><text x="288.2" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">take the reference count of every candidate</text><text x="288.2" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">call tp_traverse on each of them</text><text x="288.2" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">subtract one for every visit landing inside the set</text><text x="288.2" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">whatever is still above zero is held from outside</text></svg>
