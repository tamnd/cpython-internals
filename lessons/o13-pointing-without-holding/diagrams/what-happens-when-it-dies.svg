<svg xmlns="http://www.w3.org/2000/svg" width="663" height="558" viewBox="-24.0 -24.0 663.3 558.0" role="img" aria-label="what-happens-when-it-dies"><rect x="-24.0" y="-24.0" width="663.3" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="483.2" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="483.2" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="483.2" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="483.2" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="241.6,120.0 241.6,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="241.6" y1="180.0" x2="247.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="241.6" y1="180.0" x2="235.5" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="241.6,250.0 241.6,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="241.6" y1="310.0" x2="247.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="241.6" y1="310.0" x2="235.5" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="241.6,380.0 241.6,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="241.6" y1="440.0" x2="247.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="241.6" y1="440.0" x2="235.5" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The order that makes callbacks safe</text><text x="241.6" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the reference count reaches zero</text><text x="241.6" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">walk the chain and break every reference</text><text x="241.6" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">then walk it again and run the callbacks</text><text x="241.6" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">then free the memory</text><text x="253.6" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the object is doomed but still in memory</text><text x="253.6" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">each one now returns None</text><text x="253.6" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so a callback can never resurrect it</text></svg>
