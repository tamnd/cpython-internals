name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_TAG: v3.15.0rc1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned version is what every citation and every claim is written against,
        # so it is the version that must pass. 3.14 runs too because Pyodide is a release
        # behind, and a lesson that only works on the pin is a lesson the browser tier
        # cannot run.
        python: ["3.15.0rc1", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The checked in .python-version holds the pin, so the matrix has to overwrite it
      # rather than sit next to it, or both legs of the matrix run the same interpreter
      # and the job quietly stops testing what it says it tests.
      - run: uv python pin ${{ matrix.python }}
      # The `live` extra brings anywidget, which is what the widgets use when a reader can
      # click on them. It is installed here rather than only in a developer's environment
      # because the alternative is that the live half of every widget is never run by CI,
      # and the static half is the half that is easy to keep working.
      - run: uv sync --all-packages --extra live
      - run: uv run python -c "import sys; print(sys.version)"
      - run: uv run pytest

  notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same reasoning as the test job. The lessons are written on the pin and read on
        # whatever the browser tier is running, so both have to execute every cell.
        python: ["3.15.0rc1", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv python pin ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run python -c "import sys; print(sys.version)"
      # Every notebook is generated from the build.py next to it and also committed, because
      # a reader clicking a Colab badge cannot run a build step first. This is the step that
      # stops the two from drifting after somebody edits a cell in Jupyter and commits it.
      - run: uv run nbbuild check
      # The claim ledger is generated from the lessons the same way the notebooks are, so it
      # goes stale the same way. `nbbuild check` above already fails a claim that lost the
      # cell underneath it, because claims resolve while a lesson is being built. This is the
      # other half: the committed CLAIMS.md still says what the lessons say.
      - run: uv run nbbuild claims --check
      # Same argument one level down: a lesson embeds its diagrams as images served from
      # this repository, so the committed SVG has to still be what the script draws.
      - run: uv run nbdiagram check
      - run: uv run nbcheck lint
      # The notebooks install pyxray from this repository when they run in Colab. Here the
      # workspace copy is already installed, so what gets executed is the working tree and
      # not whatever is on main, which is the whole point of running them in a pull request.
      - run: uv run nbcheck run
      # Same cells again, on this leg's interpreter, saved as one small JSON file per
      # notebook. The versions job below is what reads them. Recording is separate from
      # `nbcheck run` on purpose: that step stops at the first cell that raises, and this
      # one keeps going, so a lesson that breaks cannot hide every version difference in
      # the lessons after it.
      - run: uv run nbversion record --into build/versions
      - uses: actions/upload-artifact@v4
        with:
          name: versions-${{ matrix.python }}
          path: build/versions
          retention-days: 1

  # Both legs of the notebooks matrix ran the same cells on different interpreters. This
  # job is the one that compares the two and fails if a cell's output depends on which
  # Python the reader has and the lesson does not say so.
  versions:
    runs-on: ubuntu-latest
    needs: notebooks
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v5
        with:
          pattern: versions-*
          merge-multiple: true
          path: build/versions
      - run: uv run nbversion compare build/versions/3.15 build/versions/3.14

  # Everything in the browser tier rests on Pyodide keeping the surfaces the lessons poke
  # at, and nobody notices when one of them goes away between releases. This job asks, on
  # every pull request, rather than the once when somebody thought to check.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/wasmprobe/package-lock.json
      - run: uv sync --all-packages
      # The committed pair first, which is cheap and catches the common failure: somebody
      # edited a check and did not rerun `just build-probe`, so the report and the notebook
      # next to it now describe something else.
      - run: uv run wasmprobe check probes/pyodide
      - run: uv run nbcheck run probes
      # Then the real thing. `npm ci` installs the pinned Pyodide, and the two runs below
      # answer the question again against whatever the world looks like today rather than
      # against a recording from whenever somebody last looked.
      - run: npm ci
        working-directory: tools/wasmprobe
      # 3.14 rather than the pin, because Pyodide ships 3.14. A native 3.15 control would
      # report every version difference as a WebAssembly one.
      - run: uv run --python 3.14 --all-packages wasmprobe native --into build/probe
        env:
          # Its own environment, or this overwrites the .venv the steps above are using and
          # the browser run below finds a 3.14 interpreter it did not ask for.
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-314
      - run: uv run wasmprobe browser --into build/probe
      # The lessons themselves, which is the question the checks above are a proxy for. A
      # fresh runtime per lesson, every code cell in order, and it fails when a cell stops
      # running in the browser and nobody has written down why.
      - run: uv run wasmprobe lessons --into build/probe
      - run: uv run wasmprobe report build/probe --into build/probe/report.md
      - run: uv run wasmprobe notebook --into build/probe/probe.ipynb
      - run: uv run wasmprobe check build/probe
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: build/probe
          retention-days: 7

  # The other half of the same question. The browser is one place a lesson runs and the
  # reader's own Python is the other, and that is not one thing either: Fedora's python3
  # ships no _testinternalcapi at all.
  #
  # This job does not re-measure. The survey pulls six images and runs a package manager in
  # each, which is half an hour, and it would answer as amd64 while the committed recording
  # is arm64, so a run here would be a second recording rather than a check of this one.
  # Re-measuring is `just build-dist`, run by a person when the pin moves. What this catches
  # is the cheap and common failure: somebody edited a channel and did not rerun it.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run distprobe check probes/distributions

  blueprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Structure only. The citations inside a blueprint are resolved by the citations job
      # below, which already treats blueprints/ as one of its roots.
      - run: uv run pytest tools/bpcheck/tests
      - run: uv run bpcheck lint
      # bpc has tests that need a CPython checkout and tests that do not. The ones that do
      # skip here and run in the citations job, which is the one with the tree.
      - run: uv run pytest tools/bpc/tests

  # The lockfile and the devcontainer, read rather than pulled. Nothing here touches the
  # registry: what this catches is the lockfile falling behind the pin, a build somebody added
  # with no image, and a devcontainer pointing at a digest the lockfile no longer names. The
  # images themselves are built and proved by the cpython-images workflow, which is the only
  # thing in this repository that compiles CPython.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest tools/cpybuild/tests
      - run: uv run cpybuild check

  # The only job here that runs an interpreter this project did not get from uv. A few
  # questions cannot be asked on a stock CPython, counting every reference in the process
  # being the one this starts with, so those programs run in the debug build the images
  # workflow publishes and what they printed is committed next to them.
  #
  # This job pulls that image by digest and runs them again. It writes nothing. A difference
  # is reported and the run goes red, which is the only thing that makes committing an answer
  # worth more than pasting one into the prose by hand.
  tier1:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run pytest tools/tier1/tests
      # The offline half first, because it is milliseconds and it catches the failure that
      # actually happens: somebody edited an experiment and left the recording underneath it.
      - run: uv run tier1 check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Measured numbers are compared by their label rather than their value. The count moves
      # by one or two between two runs of the same image, because taking the measurement is
      # itself Python, and a check that goes red for that is a check somebody deletes. The
      # assertion that would catch a real regression lives inside the program, where it runs
      # against a live interpreter every time this job does.
      - run: uv run tier1 verify

  boss:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A boss fight is the one thing here a reader runs on their own interpreter with
        # nothing installed, so it has to hold on more than the pin. 3.14 is what Colab and
        # Pyodide have, and a fight that only agrees with 3.15 would fail the reader rather
        # than teach them.
        python: ["3.15.0rc1", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv python pin ${{ matrix.python }}
      - run: uv sync --all-packages
      - run: uv run boss check
      # Twenty seeds rather than the one `just boss` runs. The generated half of a corpus is
      # different for every seed, so a rule that is nearly right passes on seed zero and fails
      # somewhere in the next few thousand functions. This is the job that finds that.
      - run: uv run boss verify --seeds 20

  animations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # There are no manimpango or pycairo wheels for 3.15 yet, so both build from source
      # here and need the Pango and Cairo headers to do it. On a developer machine Homebrew
      # or the distribution has already put them there, which is why this only shows up in CI.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      # manim is about thirty packages and a Cairo build, so it lives behind an extra and
      # only this job pays for it. Every other job still runs `xraymanim check`, because the
      # cheap half of the library deliberately does not import manim.
      - run: uv sync --all-packages --extra anim
      - run: uv run --extra anim pytest xraymanim/tests
      # ffmpeg is what turns the rendered video into the GIF a reader sees on GitHub, so
      # say so here rather than letting the render fail two minutes later. Not a pipeline:
      # under `set -e` the exit status of `a | head` is head's, so a missing ffmpeg passes.
      - run: ffmpeg -version
      # The committed GIFs are not compared byte for byte, because video encoders are not
      # reproducible across versions or platforms and a checksum here would fail for reasons
      # nobody can fix. Re-rendering catches the failure that actually happens: a scene that
      # raises because the library moved underneath it.
      - run: uv run --extra anim xraymanim render --into "$RUNNER_TEMP/anim"

  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # A blobless shallow clone is a few hundred megabytes rather than several
      # gigabytes, and it is enough to resolve every citation.
      - name: Cache the pinned CPython tree
        id: cpython-cache
        uses: actions/cache@v4
        with:
          path: vendor/cpython
          key: cpython-${{ env.PINNED_TAG }}-v1
      - name: Fetch the pinned CPython tree
        if: steps.cpython-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PINNED_TAG" --filter=blob:none \
            https://github.com/python/cpython.git vendor/cpython

      - name: Confirm the tree is the commit we pinned
        run: |
          expected=$(uv run python -c "import sys; sys.path.insert(0, 'tools/refcheck/src'); from refcheck.tree import PINNED_COMMIT; print(PINNED_COMMIT)")
          actual=$(git -C vendor/cpython rev-parse HEAD)
          if [ "$expected" != "$actual" ]; then
            echo "pinned tree is $actual but refcheck expects $expected"
            exit 1
          fi

      - run: uv sync --all-packages
      - run: uv run pytest tools/refcheck/tests
      - run: uv run refcheck verify
      # The generated sections of a blueprint are read out of Parser/Python.asdl, so this
      # is the job with the tree to read them from. It fails if the committed blueprint no
      # longer matches what the grammar says, which is what happens when the pin moves and
      # nobody reran `just build-blueprints`.
      - run: uv run bpc check
      - run: uv run pytest tools/bpc/tests
