>the test</text><text x="272.4" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">an ordinary run</text><text x="444.4" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">six runs with the hunter</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">holds nothing</text><text x="272.4" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">passed</text><text x="444.4" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">nothing left behind</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">fills a cache once</text><text x="272.4" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">passed</text><text x="444.4" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">[1, 0, 0] references, called fine</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">appends to a global list</text><text x="272.4" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">passed</text><text x="444.4" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">[1, 1, 1] references, a failure</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">duplicates a file handle</text><text x="272.4" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">passed</text><text x="444.4" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">[1, 1, 1] file descriptors, a failure</text><text x="0.0" y="269.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Every one of them passes the run you do before you open a pull request.</text></svg>
