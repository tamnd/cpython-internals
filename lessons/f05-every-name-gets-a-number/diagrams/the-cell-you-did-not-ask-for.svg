<svg xmlns="http://www.w3.org/2000/svg" width="817" height="688" viewBox="-24.0 -24.0 817.3 688.0" role="img" aria-label="the-cell-you-did-not-ask-for"><rect x="-24.0" y="-24.0" width="817.3" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="561.2" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="561.2" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="561.2" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="561.2" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="570.0" width="561.2" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="280.6,120.0 280.6,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.6" y1="180.0" x2="286.7" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="280.6" y1="180.0" x2="274.5" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="280.6,250.0 280.6,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.6" y1="310.0" x2="286.7" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="280.6" y1="310.0" x2="274.5" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="280.6,380.0 280.6,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.6" y1="440.0" x2="286.7" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="280.6" y1="440.0" x2="274.5" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="280.6,510.0 280.6,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="280.6" y1="570.0" x2="286.7" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="280.6" y1="570.0" x2="274.5" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The one name the symbol table adds that you never wrote</text><text x="280.6" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">you write super() with no arguments</text><text x="280.6" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the symbol table notices</text><text x="280.6" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">it adds __class__ to the method's free variables</text><text x="280.6" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the class body gets a cell to fill in</text><text x="280.6" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">super() finds the class it was defined in</text><text x="292.6" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">while walking the class body</text><text x="292.6" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">as if you had written nonlocal __class__</text><text x="292.6" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">handed over as __classcell__</text></svg>
