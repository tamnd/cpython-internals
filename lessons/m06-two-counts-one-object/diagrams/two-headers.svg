<svg xmlns="http://www.w3.org/2000/svg" width="700" height="594" viewBox="-24.0 -24.0 700.0 594.0" role="img" aria-label="two-headers"><rect x="-24.0" y="-24.0" width="700.0" height="594.0" fill="#ffffff"/><rect x="0.0" y="87.0" width="296.0" height="57.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="147.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="207.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="267.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="356.0" y="87.0" width="296.0" height="57.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="356.0" y="147.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="356.0" y="207.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="356.0" y="267.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="356.0" y="327.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="356.0" y="387.0" width="296.0" height="57.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="464.0" width="652.0" height="82.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">The same object header, built two ways</text><text x="81.4" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">with the GIL</text><text x="16.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_refcnt, 8 bytes</text><text x="16.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_type, 8 bytes</text><text x="16.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">16 bytes in total</text><text x="16.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">one number, one writer</text><text x="451.6" y="67.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">without it</text><text x="372.0" y="120.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_tid, who owns it</text><text x="372.0" y="180.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">flags, a lock, gc bits</text><text x="372.0" y="240.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_ref_local, 4 bytes</text><text x="372.0" y="300.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_ref_shared, 8 bytes</text><text x="372.0" y="360.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_type, 8 bytes</text><text x="372.0" y="420.0" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve">32 bytes in total</text><text x="326.0" y="497.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">The count did not get bigger. It got split, and gained a</text><text x="326.0" y="522.0" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">name for its owner.</text></svg>
