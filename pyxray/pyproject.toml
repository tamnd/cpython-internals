[project]
name = "pyxray"
version = "0.1.0"
description = "Instrumentation for looking inside a running CPython, from a notebook"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["refcheck"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxray"]

[tool.uv.sources]
refcheck = { workspace = true }
