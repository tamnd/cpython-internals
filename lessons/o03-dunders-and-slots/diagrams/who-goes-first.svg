<svg xmlns="http://www.w3.org/2000/svg" width="744" height="558" viewBox="-24.0 -24.0 743.9 558.0" role="img" aria-label="who-goes-first"><rect x="-24.0" y="-24.0" width="743.9" height="558.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="484.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="484.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="310.0" width="484.7" height="70.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><rect x="0.0" y="440.0" width="484.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><polyline points="242.4,120.0 242.4,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="242.4" y1="180.0" x2="248.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="242.4" y1="180.0" x2="236.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="242.4,250.0 242.4,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="242.4" y1="310.0" x2="248.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="242.4" y1="310.0" x2="236.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="242.4,380.0 242.4,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="242.4" y1="440.0" x2="248.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="242.4" y1="440.0" x2="236.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How one slot decides between __add__ and __radd__</text><text x="242.4" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">self + other, and nb_add dispatches both</text><text x="242.4" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">is other's type a subclass of self's type</text><text x="242.4" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and does other define __radd__ itself</text><text x="242.4" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">if both, __radd__ first, otherwise __add__</text><text x="254.4" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so the reflected call is worth considering</text><text x="254.4" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">inheriting it from a shared base does not count</text></svg>
