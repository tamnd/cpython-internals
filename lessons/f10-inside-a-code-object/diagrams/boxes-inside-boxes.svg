<svg xmlns="http://www.w3.org/2000/svg" width="985" height="382" viewBox="-52.8 -24.0 985.1 382.0" role="img" aria-label="boxes-inside-boxes"><rect x="-52.8" y="-24.0" width="985.1" height="382.0" fill="#ffffff"/><rect x="0.0" y="242.0" width="108.8" height="52.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="-28.8" y="146.0" width="166.4" height="52.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><polyline points="54.4,198.0 54.4,242.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="186.4" y="242.0" width="358.4" height="52.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="301.6" y="146.0" width="128.0" height="52.0" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><polyline points="365.6,198.0 365.6,242.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="146.0" y="50.0" width="128.0" height="52.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><polyline points="210.0,102.0 54.4,146.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="210.0,102.0 365.6,146.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Compiling one file gives you one code object, with the rest inside it</text><text x="54.4" y="271.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a method</text><text x="54.4" y="175.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the class body</text><text x="365.6" y="271.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the listcomp is inlined, so no box</text><text x="365.6" y="175.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">a function</text><text x="210.0" y="79.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the module</text><text x="0.0" y="327.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">A nested definition ends up in the outer object's constants, next to the numbers and strings.</text></svg>
