ily="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">something raises at some offset</text><text x="259.8" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">look that offset up in co_exceptiontable</text><text x="259.8" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">pop the stack back to the depth in the entry</text><text x="259.8" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jump to the target and carry on</text><text x="271.8" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">binary search, even though entries vary in size</text><text x="271.8" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which is why the depth is in the table</text></svg>
