<svg xmlns="http://www.w3.org/2000/svg" width="814" height="818" viewBox="-24.0 -24.0 814.4 818.0" role="img" aria-label="where-the-machine-code-comes-from"><rect x="-24.0" y="-24.0" width="814.4" height="818.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="472.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="472.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="310.0" width="472.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="472.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="472.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="700.0" width="472.7" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="236.3,120.0 236.3,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.3" y1="180.0" x2="242.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.3" y1="180.0" x2="230.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="236.3,250.0 236.3,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.3" y1="310.0" x2="242.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.3" y1="310.0" x2="230.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="236.3,380.0 236.3,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.3" y1="440.0" x2="242.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.3" y1="440.0" x2="230.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="236.3,510.0 236.3,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.3" y1="570.0" x2="242.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.3" y1="570.0" x2="230.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="236.3,640.0 236.3,700.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="236.3" y1="700.0" x2="242.4" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="236.3" y1="700.0" x2="230.3" y2="687.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Six steps, and only the last one happens on your machine</text><text x="236.3" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">bytecodes.c, written by hand</text><text x="236.3" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">executor_cases.c.h, generated from it</text><text x="236.3" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">one small C file per micro operation</text><text x="236.3" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">clang -Os, one object file each</text><text x="236.3" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">jit_stencils.h, shipped inside the build</text><text x="236.3" y="739.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">your trace, pasted together while it runs</text><text x="248.3" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a build step</text><text x="248.3" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one CASE at a time</text><text x="248.3" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">at build time</text><text x="248.3" y="543.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">still at build time</text><text x="248.3" y="673.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">months earlier</text></svg>
