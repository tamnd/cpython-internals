[project]
name = "bpcheck"
version = "0.1.0"
description = "Structural checks for the blueprint documents"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
bpcheck = "bpcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpcheck"]
