<svg xmlns="http://www.w3.org/2000/svg" width="789" height="364" viewBox="-24.0 -24.0 788.9 364.0" role="img" aria-label="where-your-object-goes"><rect x="-24.0" y="-24.0" width="788.9" height="364.0" fill="#ffffff"/><polyline points="0.0,76.0 651.2,76.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,76.0 651.2,76.0 651.2,116.0 0.0,116.0 0.0,76.0" fill="#a5d8ff" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 651.2,116.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,116.0 651.2,116.0 651.2,156.0 0.0,156.0 0.0,116.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 651.2,156.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,156.0 651.2,156.0 651.2,196.0 0.0,196.0 0.0,156.0" fill="#e9ecef" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 651.2,196.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,196.0 651.2,196.0 651.2,236.0 0.0,236.0 0.0,196.0" fill="#d0bfff" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 651.2,236.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,236.0 651.2,236.0 651.2,276.0 0.0,276.0 0.0,236.0" fill="#96f2d7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0.0,276.0 651.2,276.0" fill="none" stroke="#ced4da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Surviving a collection is a promotion</text><text x="14.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">after this</text><text x="330.0" y="63.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">gc.get_objects says</text><text x="14.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">you made it</text><text x="330.0" y="99.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generation 0</text><text x="14.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">one pass over generation 0</text><text x="330.0" y="139.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generation 1</text><text x="14.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">another pass over generation 0</text><text x="330.0" y="179.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generation 1</text><text x="14.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a pass over generation 1</text><text x="330.0" y="219.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generation 2</text><text x="14.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">a full pass</text><text x="330.0" y="259.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">generation 2, and it stays there</text><text x="0.0" y="309.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Nothing moves an object back down. Generation 2 is where long lived data ends up.</text></svg>
