<svg xmlns="http://www.w3.org/2000/svg" width="672" height="688" viewBox="-24.0 -24.0 671.5 688.0" role="img" aria-label="how-the-keys-get-filled"><rect x="-24.0" y="-24.0" width="671.5" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="529.4" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="529.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="529.4" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="529.4" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="570.0" width="529.4" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><polyline points="264.7,120.0 264.7,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.7" y1="180.0" x2="270.8" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="264.7" y1="180.0" x2="258.6" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="264.7,250.0 264.7,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.7" y1="310.0" x2="270.8" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="264.7" y1="310.0" x2="258.6" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="264.7,380.0 264.7,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.7" y1="440.0" x2="270.8" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="264.7" y1="440.0" x2="258.6" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="264.7,510.0 264.7,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.7" y1="570.0" x2="270.8" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="264.7" y1="570.0" x2="258.6" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Where the shared names come from</text><text x="264.7" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the compiler records every self.name it sees</text><text x="264.7" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">and stores the list as __static_attributes__</text><text x="264.7" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the class gets a keys array with room for 30</text><text x="264.7" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">prefilled from that list</text><text x="264.7" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">anything set later is added on first use</text><text x="276.7" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">a tuple you can read from Python</text><text x="276.7" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">SHARED_KEYS_MAX_SIZE, a hard limit</text><text x="276.7" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so the first instance is already laid out</text></svg>
