5057" stroke-width="2"/><polyline points="546.0,278.0 846.0,338.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="846.0" y1="338.0" x2="834.8" y2="329.6" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="846.0" y1="338.0" x2="832.4" y2="341.5" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><rect x="846.0" y="442.0" width="110.0" height="52.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><polyline points="901.0,364.0 901.0,442.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="901.0" y1="442.0" x2="907.1" y2="429.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="901.0" y1="442.0" x2="894.9" y2="429.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><rect x="964.0" y="442.0" width="110.0" height="52.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><polyline points="1019.0,364.0 1019.0,442.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="1019.0" y1="442.0" x2="1025.1" y2="429.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="1019.0" y1="442.0" x2="1012.9" y2="429.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">What a pointer actually is</text><text x="16.0" y="71.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve">in your program</text><text x="32.0" y="125.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">values</text><text x="356.0" y="71.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#6741d9" text-anchor="start" xml:space="preserve">the list object itself</text><text x="372.0" y="125.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_refcnt</text><text x="594.0" y="120.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">how many hold it</text><text x="372.0" y="177.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_type</text><text x="594.0" y="172.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">which type it is</text><text x="372.0" y="229.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_size</text><text x="594.0" y="224.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">len() reads this</text><text x="372.0" y="281.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">ob_item</text><text x="594.0" y="276.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">-&gt; the slot array</text><text x="372.0" y="333.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">allocated</text><text x="594.0" y="328.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">slots there are</text><text x="227.2" y="109.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">points at</text><text x="846.0" y="287.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve">the slot array, allocated wide</text><text x="862.0" y="341.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">slot 0</text><text x="980.0" y="341.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">slot 1</text><text x="1098.0" y="341.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">unused</text><text x="1216.0" y="341.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">unused</text><text x="862.0" y="471.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">'a'</text><text x="980.0" y="471.6" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#1e1e1e" text-anchor="start" xml:space="preserve">'b'</text><text x="0.0" y="527.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Three separate blocks of memory, joined by two arrows. The name holds an address. The struct holds five</text><text x="0.0" y="547.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">fields, one of which is another address. The slot array holds addresses of the objects themselves.</text><text x="0.0" y="567.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">Every star in the C source is one of these arrows, and every arrow is a number that happens to be an address.</text></svg>
