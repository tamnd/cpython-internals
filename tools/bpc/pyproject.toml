[project]
name = "bpc"
version = "0.1.0"
description = "The blueprint compiler, which generates blueprint sections from CPython's own inputs"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["refcheck"]

[project.scripts]
bpc = "bpc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpc"]

[tool.uv.sources]
refcheck = { workspace = true }
