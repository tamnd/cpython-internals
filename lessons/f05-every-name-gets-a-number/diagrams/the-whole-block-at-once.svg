<svg xmlns="http://www.w3.org/2000/svg" width="931" height="688" viewBox="-24.0 -24.0 931.4 688.0" role="img" aria-label="the-whole-block-at-once"><rect x="-24.0" y="-24.0" width="931.4" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="479.0" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="479.0" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><rect x="0.0" y="310.0" width="479.0" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="440.0" width="479.0" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="570.0" width="479.0" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><polyline points="239.5,120.0 239.5,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="239.5" y1="180.0" x2="245.6" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="239.5" y1="180.0" x2="233.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="239.5,250.0 239.5,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="239.5" y1="310.0" x2="245.6" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="239.5" y1="310.0" x2="233.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="239.5,380.0 239.5,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="239.5" y1="440.0" x2="245.6" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="239.5" y1="440.0" x2="233.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="239.5,510.0 239.5,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="239.5" y1="570.0" x2="245.6" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="239.5" y1="570.0" x2="233.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Why the classic UnboundLocalError happens, in the order it happens</text><text x="239.5" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">def f():</text><text x="239.5" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">print(x), a use with nothing assigned yet</text><text x="239.5" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">x = 1, four words later</text><text x="239.5" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">x is LOCAL for the whole function</text><text x="239.5" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">the print reads a local that has no value</text><text x="251.5" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">the pass reads the whole body first</text><text x="251.5" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">one assignment is enough</text><text x="251.5" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">so the compiler emits LOAD_FAST_CHECK</text></svg>
