[project]
name = "cpython-internals"
version = "0.0.0"
description = "A visual teardown of CPython 3.15, and a specification you can reimplement from"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

dependencies = [
    "nbbuild",
    "nbcheck",
    "pyxray",
    "refcheck",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["pyxray", "tools/nbbuild", "tools/nbcheck", "tools/refcheck"]

[tool.uv.sources]
nbbuild = { workspace = true }
nbcheck = { workspace = true }
pyxray = { workspace = true }
refcheck = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["pyxray/tests", "tools/nbbuild/tests", "tools/nbcheck/tests", "tools/refcheck/tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "pinned: needs the pinned CPython source tree",
    "freethreaded: needs a free threaded build",
]
filterwarnings = ["error"]

[tool.ruff.lint.isort]
known-first-party = ["nbbuild", "nbcheck", "pyxray", "refcheck"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The instrumentation packages deliberately touch private interpreter internals, and
    # renaming those to satisfy a linter would make them stop matching CPython's own names.
    "N802",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
# A lesson builder is mostly prose in triple quoted strings, and the project writes one
# paragraph per line so that a sentence is never split across two of them. Wrapping those
# to satisfy a line length rule would break the thing the rule is there to protect.
"lessons/**/build.py" = ["E501"]
# The lesson notebooks are the one thing here that runs on an interpreter we do not choose.
# A reader in Colab is on whatever Google installed, so a version check the linter thinks
# is dead code is the cell that tells them why nothing below works.
"lessons/**/*.ipynb" = ["UP036"]
