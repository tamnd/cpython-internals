<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="688" viewBox="-24.0 -24.0 1033.7 688.0" role="img" aria-label="two-passes"><rect x="-24.0" y="-24.0" width="1033.7" height="688.0" fill="#ffffff"/><rect x="0.0" y="50.0" width="592.7" height="70.0" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><rect x="0.0" y="180.0" width="592.7" height="70.0" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><rect x="0.0" y="310.0" width="592.7" height="70.0" rx="12" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><rect x="0.0" y="440.0" width="592.7" height="70.0" rx="12" fill="#96f2d7" stroke="#099268" stroke-width="2"/><rect x="0.0" y="570.0" width="592.7" height="70.0" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/><polyline points="296.4,120.0 296.4,180.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="296.4" y1="180.0" x2="302.4" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="296.4" y1="180.0" x2="290.3" y2="167.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="296.4,250.0 296.4,310.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="296.4" y1="310.0" x2="302.4" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="296.4" y1="310.0" x2="290.3" y2="297.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="296.4,380.0 296.4,440.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="296.4" y1="440.0" x2="302.4" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="296.4" y1="440.0" x2="290.3" y2="427.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><polyline points="296.4,510.0 296.4,570.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="296.4" y1="570.0" x2="302.4" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><line x1="296.4" y1="570.0" x2="290.3" y2="557.4" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><text x="0.0" y="20.4" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Good error messages are a second parse, paid for only when you need one</text><text x="296.4" y="89.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">parse with 209 rules</text><text x="296.4" y="219.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">did it work?</text><text x="296.4" y="349.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">parse again with all 277</text><text x="296.4" y="479.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">an invalid_ rule matches and says what is wrong</text><text x="296.4" y="609.5" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">no invalid_ rule matches, so it says invalid syntax</text><text x="308.4" y="153.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">yes, hand back the tree and stop</text><text x="308.4" y="283.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">no, so slow down and look harder</text><text x="308.4" y="413.6" font-family="Nunito, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#5c5f66" text-anchor="start" xml:space="preserve">usually</text></svg>
